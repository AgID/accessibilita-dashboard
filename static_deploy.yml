# static_deploy.yml — settings for the Devops-AWS "static" deploy

# Vite bundles (content-hashed file names): cached for one year
immutable_paths:
  - assets/

# Data, PDFs and images under public/ keep their names across releases: short cache
cache_control_assets: public, max-age=3600

# Collaudo: accesso dalla rete autorizzata OPPURE con la credenziale
# (valori nel vault coll: static_access_username, static_access_password,
# static_access_allowed_cidrs)
access:
  environments: [coll]
  basic_auth: true
  ip_allowlist: true
  combine: any

not_found_paths:
  - /assets/
  - /bootstrap-italia/
  - /data/
  - /pdf/
  - /images/
  - /icons/
  - /logo/
