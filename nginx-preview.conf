# nginx-preview.conf — local preview only (not used by the Devops-AWS deploy)
server {
    listen 80;
    root /usr/share/nginx/html;

    # Deploy-time templates are never served
    location ~ \.j2$ { return 404; }

    # Routify uses browser history: unknown paths fall back to index.html,
    # as CloudFront does with the custom error responses 403/404 -> /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
